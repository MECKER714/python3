<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Christmas Tree</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #05070a; color: #cfd8dc;
               font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  #app { height: 100%; }
  #term { height: 100%; padding: 6px 8px; box-sizing: border-box; overflow: hidden; }
  .xterm-viewport { overflow: hidden !important; }
</style>
</head>
<body>
<div id="app">
  <div id="term"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
(async () => {
  const MIN_COLS = 80;
  const FPS = 20;
  const el = document.getElementById("term");

  const term = new Terminal({
    convertEol: true,
    disableStdin: true,
    cursorBlink: false,
    scrollback: 0,
    fontFamily: '"D2Coding", "Noto Sans Mono CJK KR", "Menlo", "Consolas", monospace',
    fontSize: 14,
    theme: { background: "#000000" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(el);
  term.write("\x1b[?25l");

  // 좁은 화면에서는 글자 크기를 줄여 80칸 이상 확보
  function layout() {
    const w = el.clientWidth - 16;
    const size = Math.max(6, Math.min(16, Math.floor(w / (MIN_COLS + 8) / 0.6)));
    term.options.fontSize = size;
    fit.fit();
    term.write("\x1b[2J");
  }
  layout();
  window.addEventListener("resize", layout);

  term.write("Python(Pyodide)을 불러오는 중입니다… 처음 한 번만 오래 걸려요.\r\n");

  let tree;
  try {
    const pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
    const src = await (await fetch("tree.py", { cache: "no-cache" })).text();
    pyodide.FS.writeFile("/tmp/tree.py", src);
    pyodide.runPython("import sys; sys.path.insert(0, '/tmp')");
    tree = pyodide.pyimport("tree");
  } catch (err) {
    term.write("\x1b[2J\x1b[H" + String(err).replace(/\n/g, "\r\n"));
    return;
  }

  term.write("\x1b[2J");
  let t0 = performance.now();
  let last = 0;

  function loop(now) {
    requestAnimationFrame(loop);
    if (now - last < 1000 / FPS - 2) return;
    last = now;
    try {
      term.write(tree.render_frame((now - t0) / 1000, term.cols, term.rows));
    } catch (err) {
      term.write("\x1b[2J\x1b[H" + String(err));
    }
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
